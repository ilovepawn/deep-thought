[project]
name = "deep-thought"
version = "0.1.0"
description = "Chess game analysis worker for the ilovepawn platform. Consumes RabbitMQ analysis requests, runs Stockfish, writes annotated PGNs to S3."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "chess>=1.11.0",
    "pika>=1.3.2",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_thought"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
